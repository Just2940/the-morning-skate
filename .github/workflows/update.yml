name: Daily Morning Skate Update

on:
  schedule:
    # GitHub starts scheduled runs hours late (these two slots landed at
    # 10 AM - 2 PM Eastern in Sep 2026), so the on-time edition is triggered
    # at 4:30 AM Eastern by wake-up.yml. These schedules are BACKUPS: each
    # one skips if today's edition is already live (see the guard step).
    - cron: "17 8 * * *"
    - cron: "43 11 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Email the morning brief after this run"
        type: boolean
        default: false

# Never let two runs race each other to push data.json.
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write        # plain-English failure alerts
    defaults:
      run:
        shell: bash        # bash -eo pipefail: a failing step stays failed through `tee`
    steps:
      - uses: actions/checkout@v4

      - name: Skip backup run if today's edition already shipped
        id: guard
        run: |
          TODAY=$(TZ='America/New_York' date +%F)
          LAST=$(python3 -c "import json;print(((json.load(open('data.json')).get('meta') or {}).get('updated') or '')[:10])" 2>/dev/null || echo "")
          echo "Today (ET): $TODAY | last edition: ${LAST:-none}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LAST" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's edition is already live - backup run has nothing to do."
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests

      - name: Regression tests (phases, schedule parser, sources, AI checks)
        if: steps.guard.outputs.skip != 'true'
        run: python -m unittest discover -s tests -v 2>&1 | tee tests.txt

      - name: Run update script
        if: steps.guard.outputs.skip != 'true'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python -u scripts/update-content.py 2>&1 | tee update.log

      - name: Validate content (Section 0 rules)
        if: steps.guard.outputs.skip != 'true'
        # Enforces every rule in SKILL.md Section 0. If ANY check fails, the
        # workflow fails here and the commit+push step below is skipped —
        # yesterday's data.json stays live. That's the whole point.
        run: python scripts/validate_content.py --data data.json --html index.html 2>&1 | tee validation.txt

      - name: Check for changes
        if: steps.guard.outputs.skip != 'true'
        id: changes
        run: git diff --quiet data.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.guard.outputs.skip != 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Morning Skate Bot"
          git config user.email "morning-skate-bot@themorningskate.com"
          git add data.json
          git commit -m "Daily update: $(TZ='America/New_York' date +'%B %d, %Y') morning briefing"
          # GitHub occasionally answers a push with a 500 (Sep 29 2026) - retry.
          ok=""
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then ok=1; break; fi
            echo "Push attempt $i failed - retrying in 20 seconds"
            sleep 20
          done
          [ -n "$ok" ]

      - name: Email the morning brief
        if: steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.send_email)
        env:
          BRIEF_SMTP_USER: ${{ secrets.BRIEF_SMTP_USER }}
          BRIEF_SMTP_PASS: ${{ secrets.BRIEF_SMTP_PASS }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
        run: python scripts/send_brief.py 2>&1 | tee email.txt

      - name: Close any open failure alert
        if: success() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/alert.py resolve

      - name: Plain-English failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRIEF_SMTP_USER: ${{ secrets.BRIEF_SMTP_USER }}
          BRIEF_SMTP_PASS: ${{ secrets.BRIEF_SMTP_PASS }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
        run: python3 scripts/alert.py open
